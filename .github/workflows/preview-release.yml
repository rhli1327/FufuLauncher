name: Preview Release

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Build FufuLauncher
      run: dotnet build FufuLauncher\FufuLauncher.csproj -c ${{ matrix.configuration }} /p:Platform="x64"

    - name: Checkout FufuLauncher.UnlockerIsland
      uses: actions/checkout@v4
      with:
        repository: FufuLauncher/FufuLauncher.UnlockerIsland
        ref: 2de496af1825ae45869218870f37f40f7023fe2e
        path: FufuLauncher.UnlockerIsland_Repo

    - name: Build pinned launcher and plugin sources
      run: |
        msbuild FufuLauncher.UnlockerIsland_Repo\Launcher\Launcher.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        msbuild FufuLauncher.UnlockerIsland_Repo\Launcher_2\Launcher_2.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        msbuild FufuLauncher.UnlockerIsland_Repo\FufuLauncher.UnlockerIsland\FufuLauncher.UnlockerIsland.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Replace launcher and plugin binaries
      shell: pwsh
      run: |
        $baseOutputDir = "FufuLauncher\bin\x64\Release\net8.0-windows10.0.26100.0"
        $pluginOutputDir = "$baseOutputDir\Plugins\FuFuPlugin"

        $launcherDll = Get-ChildItem -Path "FufuLauncher.UnlockerIsland_Repo" -Filter "Launcher.dll" -Recurse | Where-Object { $_.FullName -match "x64" -and $_.FullName -match "Release" } | Select-Object -First 1
        $launcher2Exe = Get-ChildItem -Path "FufuLauncher.UnlockerIsland_Repo" -Filter "Launcher_2.exe" -Recurse | Where-Object { $_.FullName -match "x64" -and $_.FullName -match "Release" } | Select-Object -First 1
        $pluginDll = Get-ChildItem -Path "FufuLauncher.UnlockerIsland_Repo" -Filter "FufuLauncher.UnlockerIsland.dll" -Recurse | Where-Object { $_.FullName -match "x64" -and $_.FullName -match "Release" } | Select-Object -First 1

        if ($launcherDll -and $launcher2Exe -and $pluginDll) {
            New-Item -ItemType Directory -Force -Path $pluginOutputDir | Out-Null
            Copy-Item -Path $launcherDll.FullName -Destination "$baseOutputDir\Launcher.dll" -Force
            Copy-Item -Path $launcher2Exe.FullName -Destination "$baseOutputDir\Launcher_2.exe" -Force
            Copy-Item -Path $pluginDll.FullName -Destination "$pluginOutputDir\FufuLauncher.UnlockerIsland.dll" -Force
            Write-Host "Replaced launcher and plugin binaries from pinned source commits"
        } else {
            Write-Error "Unable to locate a launcher or plugin build output"
            exit 1
        }

    - name: Verify pinned Genshin 7.2 Lite plugin
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path LiteStaging | Out-Null
        Invoke-WebRequest "https://github.com/FufuLauncher/YuanShen-UnlockerLite/releases/download/v7.2.3/YuanShen-UnlockerLite.zip" -OutFile "LiteStaging\YuanShen-UnlockerLite.zip"
        $zipHash = (Get-FileHash "LiteStaging\YuanShen-UnlockerLite.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($zipHash -ne "a1a7150c42b401a659a4a569a386989c3cee251c895ca86670d6a547afb526d9") { throw "Lite bundle SHA-256 mismatch" }
        $liteDir = "LiteStaging\Extracted"
        Expand-Archive "LiteStaging\YuanShen-UnlockerLite.zip" -DestinationPath $liteDir -Force
        $dllHash = (Get-FileHash "$liteDir\YuanShen-UnlockerLite.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($dllHash -ne "265dabd754fd5a64e55a811cfbc4ccbc9a1a7f78b23c642978a120f5bf88d05b") { throw "Lite DLL SHA-256 mismatch" }

    - name: Checkout FufuLauncher.CaptureApp
      uses: actions/checkout@v4
      with:
        repository: rhli1327/FufuLauncher.CaptureApp
        ref: 8e9975ee036261b9aa22f8df13dc917e3e6f7528
        path: FufuLauncher.CaptureApp_Repo

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore CaptureApp NuGet Packages
      run: nuget restore FufuLauncher.CaptureApp_Repo\CaptureApp.sln

    - name: Build CaptureApp
      run: msbuild FufuLauncher.CaptureApp_Repo\CaptureApp.sln /p:Configuration=Release /p:Platform="Any CPU"

    - name: Replace CaptureApp.exe
      shell: pwsh
      run: |
        $baseOutputDir = "FufuLauncher\bin\x64\Release\net8.0-windows10.0.26100.0"
        $captureAppExe = Get-ChildItem -Path "FufuLauncher.CaptureApp_Repo" -Filter "CaptureApp.exe" -Recurse | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
        
        if ($captureAppExe) {
            Copy-Item -Path $captureAppExe.FullName -Destination "$baseOutputDir\CaptureApp.exe" -Force
            Write-Host "成功替换CaptureApp.exe"
        } else {
            Write-Error "未能定位到CaptureApp.exe编译产物"
            exit 1
        }

    - name: Publish UpdateFufuLauncher (Single File)
      run: |
        dotnet publish UpdateFufuLauncher\UpdateFufuLauncher.csproj -c ${{ matrix.configuration }} /p:Platform="x64" -f net8.0-windows -r win-x64 --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:DeleteExistingFiles=true -o PublishOutput

    - name: Move UpdateFufuLauncher to FufuLauncher build directory
      shell: pwsh
      run: |
        $fufuOutputDir = Get-ChildItem -Path "FufuLauncher\bin" -Recurse -Directory | Where-Object { $_.FullName -match "${{ matrix.configuration }}" -and $_.FullName -match "net8.0-windows" } | Select-Object -First 1
        
        if ($fufuOutputDir) {
            Copy-Item -Path "PublishOutput\*" -Destination $fufuOutputDir.FullName -Force -Recurse
            Write-Host "已将UpdateFufuLauncher的发布产物移动至$($fufuOutputDir.FullName)"
        } else {
            Write-Error "未能定位到FufuLauncher的构建输出目录"
            exit 1
        }

    - name: Install UPX
      run: choco install upx --no-progress

    - name: Compress Launcher files with UPX
      shell: pwsh
      run: |
        $baseOutputDir = "FufuLauncher\bin\x64\Release\net8.0-windows10.0.26100.0"
        Write-Host "Compressing Launcher.dll and Launcher_2.exe with UPX (best compression)..."
        upx --best "$baseOutputDir\Launcher.dll"
        upx --best "$baseOutputDir\Launcher_2.exe"

    - name: Bind application to the final source-built plugin
      shell: pwsh
      run: |
        $baseOutputDir = "FufuLauncher\bin\x64\Release\net8.0-windows10.0.26100.0"
        $pluginDir = Join-Path $baseOutputDir "Plugins\FuFuPlugin"
        New-Item -ItemType Directory -Force -Path PluginStaging | Out-Null
        Compress-Archive -Path "$pluginDir\*" -DestinationPath "PluginStaging\FuFuPlugin.zip" -Force
        ./scripts/Write-PluginBuildPins.ps1 -PluginZip "PluginStaging\FuFuPlugin.zip" -PluginDll "$pluginDir\FufuLauncher.UnlockerIsland.dll" -SourceCommit "2de496af1825ae45869218870f37f40f7023fe2e" -ReleaseTag "v1.7.2.2-preview"
        dotnet build FufuLauncher\FufuLauncher.csproj -c ${{ matrix.configuration }} /p:Platform="x64" --no-restore
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet run --project tests/LauncherRegression/LauncherRegression.csproj -c Release -- --downloaded "PluginStaging\FuFuPlugin.zip"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet run --project tests/LauncherRegression/LauncherRegression.csproj -c Release -- --downloaded-lite "LiteStaging\YuanShen-UnlockerLite.zip"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Upload plugin build pins
      uses: actions/upload-artifact@v4
      with:
        name: Plugin-Build-Pins
        path: |
          PluginStaging/plugin-build.json
          FufuLauncher/Constants/PluginBuildPins.cs

    - name: Regenerate integrity manifest
      shell: pwsh
      run: |
        $outputDir = "FufuLauncher\bin\x64\Release\net8.0-windows10.0.26100.0"
        $hashFile = Join-Path $outputDir "Assets\Launcher\hash.txt"
        $captureApp = Join-Path $outputDir "CaptureApp.exe"
        $launcher = Join-Path $outputDir "Launcher.dll"
        $plugin = Join-Path $outputDir "Plugins\FuFuPlugin\FufuLauncher.UnlockerIsland.dll"
        [string[]]$existingLines = @()
        if (Test-Path $hashFile) {
            $existingLines = @(Get-Content $hashFile -ErrorAction SilentlyContinue)
        }
        $line1 = if ($existingLines.Count -gt 0) { $existingLines[0] } else { "" }
        $line2 = (Get-FileHash $captureApp -Algorithm SHA512).Hash.ToLower()
        $line3 = (Get-FileHash $launcher -Algorithm SHA512).Hash.ToLower()
        $line4 = (Get-FileHash $plugin -Algorithm SHA512).Hash.ToLower()
        $hashDir = Split-Path $hashFile -Parent
        if (!(Test-Path $hashDir)) {
            New-Item -ItemType Directory -Force -Path $hashDir | Out-Null
        }
        Set-Content -Path $hashFile -Value @($line1, $line2, $line3, $line4)
        Write-Host "Updated hash.txt with final launcher and plugin hashes"

    - name: Generate release build identity
      shell: pwsh
      run: ./scripts/Write-ReleaseBuild.ps1 -OutputDirectory "FufuLauncher\bin\x64\Release\net8.0-windows10.0.26100.0" -BuildId "${{ github.run_id }}-${{ github.run_attempt }}" -SourceCommit "${{ github.sha }}" -Channel preview

    - name: Verify build-based update checks
      run: dotnet run --project tests/ReleaseUpdateRegression/ReleaseUpdateRegression.csproj -c Release

    - name: Upload release build identity
      uses: actions/upload-artifact@v4
      with:
        name: Release-Build
        path: FufuLauncher/bin/x64/Release/net8.0-windows10.0.26100.0/release-build.json

    - name: Verify elevated launch plugin resolution and integrity
      run: dotnet run --project tests/LauncherRegression/LauncherRegression.csproj -c Release -- --packaged "FufuLauncher\bin\x64\Release\net8.0-windows10.0.26100.0"

    - name: Package Portable ZIP (Green Version)
      shell: pwsh
      run: |
        $outputDir = "FufuLauncher\bin\x64\Release\net8.0-windows10.0.26100.0"
        $zipPath = "FufuLauncher-Portable.zip"
        Compress-Archive -Path "$outputDir\*" -DestinationPath $zipPath -Force

    - name: Upload Portable ZIP Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FufuLauncher-Portable
        path: FufuLauncher-Portable.zip

    - name: Compile Inno Setup Script
      run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" FufuLauncher.Installer\setup.iss'

    - name: Get Executable Name
      shell: pwsh
      run: |
        $exeFile = Get-ChildItem -Path "FufuLauncher.Installer\installer" -Filter "*.exe" | Select-Object -First 1
        if ($exeFile) {
            Write-Output "EXE_NAME=$($exeFile.BaseName)" >> $env:GITHUB_ENV
            Write-Output "### Build Successful" >> $env:GITHUB_STEP_SUMMARY
            Write-Output "Generated Installer: **$($exeFile.Name)**" >> $env:GITHUB_STEP_SUMMARY
            Write-Host "$($exeFile.BaseName)"
        } else {
            Write-Error "目录下未找到已打包的exe文件"
            exit 1
        }

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.EXE_NAME }}
        path: FufuLauncher.Installer\installer\*.exe

    - name: Package FuFuPlugin
      shell: pwsh
      run: |
        $pluginDir = "FufuLauncher\bin\x64\Release\net8.0-windows10.0.26100.0\Plugins\FuFuPlugin"
        $stagingDir = "PluginStaging"
        New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null
        
        if (Test-Path "$pluginDir\*") {
            if (!(Test-Path "$stagingDir\FuFuPlugin.zip")) { throw "Missing verified plugin bundle" }
            Copy-Item -Path "$stagingDir\FuFuPlugin.zip" -Destination "$stagingDir\FuFuPlugin-old.zip" -Force
            Copy-Item -Path "$stagingDir\FuFuPlugin.zip" -Destination "$stagingDir\FuFuPlugin.vmp.zip" -Force
            Copy-Item -Path "$stagingDir\FuFuPlugin.zip" -Destination "$stagingDir\FuFuPlugin.vmp2.zip" -Force
            
            Compress-Archive -Path "$stagingDir\*.zip" -DestinationPath "FuFuPlugin_Bundle.zip" -Force
        } else {
            Write-Host "FuFuPlugin 目录为空或不存在，跳过打包。"
            New-Item -ItemType File -Force -Path "FuFuPlugin_Bundle.zip" | Out-Null
        }

    - name: Upload FuFuPlugin Bundle
      uses: actions/upload-artifact@v4
      with:
        name: FuFuPlugin-Bundle
        path: FuFuPlugin_Bundle.zip
